<!doctype html>

-->
<html lang="es">

    <title>Consulta telemática de expedientes (forma desconocida)</title>
  </head>
  <body>

      <label for="codigoNieCompleto">NIE</label>
      <input type="text" name="formuNac.codigoNieCompleto" id="codigoNieCompleto" value="" />
      <input type="submit" id="submitNac" name="action:enviarDatosNacionalidad" value="Consultar" />
    </form>
  </body>
</html>
